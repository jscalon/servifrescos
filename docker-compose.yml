services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=100
      - VITE_HOST=0.0.0.0
    depends_on:
      - backend
    command: sh -c "npm run dev -- --host 0.0.0.0"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - DB_USER=sa
      - DB_PASSWORD=YourStrong!Passw0rd
    depends_on:
      - db
    command: sh -c "until nc -z db 1433; do echo 'Waiting for db...'; sleep 1; done; python scripts/create_db.py && python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"

  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong!Passw0rd
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - db_data:/var/opt/mssql/data
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "if timeout 1 bash -c '</dev/tcp/localhost/1433' >/dev/null 2>&1; then exit 0; else exit 1; fi",
        ]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 30s

volumes:
  frontend_node_modules:
  db_data:
